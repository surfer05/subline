<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Strict CSP. `design.css` is generated from design/ by scripts/buildSite.mjs and
  ships beside this file; nothing here reaches the network, which is why the
  design contract forbids web fonts and remote images outright.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
<title>Subline</title>
<link rel="stylesheet" href="./design.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
    <div class="win" role="group" aria-label="Subline installer">
        <header class="bar">
            <span class="mark">subline</span>
        </header>

        <main class="body">
            <p class="eyebrow" id="eyebrow" hidden></p>
            <h1 id="step-name"></h1>
            <p class="lede" id="detail"></p>
            <div id="extra"></div>
            <div id="error" hidden></div>
        </main>

        <footer class="foot">
            <div class="foot-l">
                <button class="btn btn-quiet" id="copy-diagnostics">Copy diagnostics</button>
                <button class="btn btn-quiet" id="uninstall">Uninstall</button>
            </div>
            <div class="foot-r" id="actions"></div>
        </footer>
    </div>
    <script type="module" src="./renderer.js"></script>
</body>
</html>
