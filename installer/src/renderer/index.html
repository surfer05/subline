<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Subline</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1e;
        --muted: #5c5c66;
        --line: #e2e2e8;
        --accent: #5865f2;
        --danger: #c0392b;
        --ok: #1e8e3e;
    }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #1c1c20; --fg: #ececf1; --muted: #a0a0ad; --line: #33333b; }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    header {
        padding: 34px 32px 12px;
        -webkit-app-region: drag;
    }
    header h1 { margin: 0; font-size: 15px; letter-spacing: 0.02em; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    main { flex: 1; overflow-y: auto; padding: 8px 32px 24px; }
    #detail { font-size: 15px; margin: 0 0 18px; max-width: 56ch; }
    footer {
        border-top: 1px solid var(--line);
        padding: 14px 32px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    footer .spacer { flex: 1; }
    button {
        font: inherit;
        padding: 7px 15px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.link { border: none; padding: 4px 0; color: var(--muted); text-decoration: underline; }
    .spinner {
        width: 13px; height: 13px; border-radius: 50%;
        border: 2px solid var(--line); border-top-color: var(--accent);
        animation: spin 0.8s linear infinite; display: inline-block; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
        border-left: 3px solid var(--danger);
        padding: 2px 0 2px 12px;
        color: var(--muted);
        font-size: 12.5px;
        margin-bottom: 16px;
        /* The errno is appended on its own line. Without this it silently
           collapses into the path and the detail we added is invisible. */
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--danger); font-weight: 600; }
    select, .list { width: 100%; max-width: 420px; font: inherit; padding: 7px; border-radius: 7px;
                    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    .list { list-style: none; margin: 0 0 16px; padding: 0; border: none; }
    .list li { margin-bottom: 8px; }
    .list button { width: 100%; text-align: left; }
    .sub { color: var(--muted); font-size: 12px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
    <header>
        <h1>Subline</h1>
        <p id="step-name"></p>
    </header>
    <main>
        <p id="detail"></p>
        <div id="extra"></div>
        <div id="error" class="error" hidden></div>
    </main>
    <footer>
        <div id="actions"></div>
        <div class="spacer"></div>
        <button class="link" id="copy-diagnostics">Copy diagnostics</button>
        <button class="link danger" id="uninstall">Uninstall</button>
    </footer>
    <script type="module" src="./renderer.js"></script>
</body>
</html>
