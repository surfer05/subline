<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Subline</title>
  <!-- Subline app mark, redrawn from icon-reference.png (the design source of truth):
       one monochrome paper ribbon that curls at the top-right, sweeps down-left and
       curls again at the bottom-left (a soft S), with faint four-point sparkles, on a
       dark charcoal rounded square. macOS icon grid: 824 px square inset 100 px (the .ico is cropped to that square).
       The artwork group is authored in reference-pixel space (square 23..436) and
       scaled onto the grid; the scroll itself is drawn in a frame rotated -45deg
       (u = along the roll axis, v = direction the sheet travels). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="0.55" stop-color="#262626"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <!-- top roll, across its diameter (v): dark upper edge, bright belly, grey underside -->
    <linearGradient id="topRoll" x1="0" y1="-101" x2="0" y2="-23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset="0.14" stop-color="#9d9d9b"/>
      <stop offset="0.42" stop-color="#dad9d6"/>
      <stop offset="0.66" stop-color="#ecebe8"/>
      <stop offset="0.86" stop-color="#d0cfcc"/>
      <stop offset="1" stop-color="#8e8d8b"/>
    </linearGradient>
    <!-- top roll's open end (spiral face) -->
    <radialGradient id="topFace" cx="-44" cy="-62" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#858481"/>
      <stop offset="0.6" stop-color="#8f8e8b"/>
      <stop offset="1" stop-color="#9d9c99"/>
    </radialGradient>
    <!-- sheet, along the roll axis (u): grey on the left, lighter to the right -->
    <linearGradient id="sheet" x1="-78" y1="0" x2="63" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="0.45" stop-color="#b2b0ac"/>
      <stop offset="1" stop-color="#c6c4c0"/>
    </linearGradient>
    <!-- shade the sheet gets just below the top roll -->
    <linearGradient id="rollShade" x1="0" y1="-26" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- bottom roll, across its diameter -->
    <linearGradient id="botRoll" x1="0" y1="31" x2="0" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <!-- the bottom curl darkens toward its open end (underside showing) -->
    <linearGradient id="botDark" x1="-100" y1="0" x2="-50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="botFace" cx="-96" cy="54" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a6967"/>
      <stop offset="0.7" stop-color="#535250"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </radialGradient>
    <!-- ROLLEND-DEFS -->
    <!-- end faces: soft matte shading only, lit toward the upper right (+u), shadowed lower left, no rim -->
    <linearGradient id="topWell" x1="-78" y1="-80" x2="-10" y2="-44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#858481"/>
      <stop offset="0.55" stop-color="#a7a6a3"/>
      <stop offset="1" stop-color="#c4c3bf"/>
    </linearGradient>
    <radialGradient id="topWellShade" cx="-44" cy="-62" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topHole" cx="-44" cy="-62" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101010" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#1a1a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#262626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="botWell" x1="-144" y1="48" x2="-76" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c4b4a"/>
      <stop offset="0.55" stop-color="#666563"/>
      <stop offset="1" stop-color="#83827f"/>
    </linearGradient>
    <radialGradient id="botWellShade" cx="-110" cy="66" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botHole" cx="-110" cy="66" r="9.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#141414" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e1e1e" stop-opacity="0"/>
    </radialGradient>
    <!-- /ROLLEND-DEFS -->
    <!-- the "one turn in" crease fades out toward the opening and toward the outer edge -->
    <radialGradient id="creaseFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="topCreaseMask" maskUnits="userSpaceOnUse" x="-90" y="-110" width="92" height="96">
      <ellipse cx="-44" cy="-62" rx="34" ry="39" fill="url(#creaseFade)"/>
    </mask>
    <mask id="botCreaseMask" maskUnits="userSpaceOnUse" x="-155" y="20" width="92" height="92">
      <ellipse cx="-110" cy="66" rx="34" ry="36" fill="url(#creaseFade)"/>
    </mask>
    <filter id="crease" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="sheetEdgeTone" x1="-78" y1="0" x2="-73" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <clipPath id="squareClip">
      <rect x="23" y="43" width="413" height="413" rx="92"/>
    </clipPath>
    <path id="spark" d="M0 -1 L0.045 -0.045 L1 0 L0.045 0.045 L0 1 L-0.045 0.045 L-1 0 L-0.045 -0.045 Z"/>
  </defs>

  <!-- ground -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#ground)"/>

  <g transform="translate(100 100) scale(1.99516) translate(-23 -43)">
    <g clip-path="url(#squareClip)">
      <!-- soft shadow under the ribbon -->
      <g transform="translate(3 18)" filter="url(#soft)" opacity="0.55">
        <g transform="translate(231 246) rotate(-45) scale(1.04)" fill="#000">
          <path d="M-44 -101 H108 A39 39 0 0 1 108 -23 H63 V66 A35 35 0 0 1 28 101 H-113 A35 35 0 0 1 -113 31 H-78 V-23 A39 39 0 0 1 -44 -101 Z"/>
        </g>
      </g>

      <!-- sparkles: thin, low-contrast, four-point -->
      <g fill="#d8d8d8" filter="url(#glow)">
        <use href="#spark" transform="translate(95 226) rotate(45) scale(36)" opacity="0.15"/>
        <use href="#spark" transform="translate(367 273) rotate(45) scale(32)" opacity="0.14"/>
        <use href="#spark" transform="translate(182 99) rotate(45) scale(18)" opacity="0.1"/>
        <use href="#spark" transform="translate(300 404) rotate(45) scale(16)" opacity="0.09"/>
      </g>
    </g>

    <!-- the scroll -->
    <g transform="translate(231 246) rotate(-45) scale(1.04)">
      <!-- sheet -->
      <rect x="-78" y="-62" width="141" height="100" fill="url(#sheet)"/>
      <rect x="-78" y="-62" width="141" height="76" fill="url(#rollShade)"/>

      <!-- paper thickness: only a faint tone change at the sheet's left edge, no drawn line -->
      <rect x="-78" y="-62" width="5" height="92" fill="url(#sheetEdgeTone)"/>
      <!-- bottom roll: front face continues the sheet, curls back at the right, open end at left -->
      <path d="M-113 30 H63 V66 A35 35 0 0 1 28 101 H-113 Z" fill="url(#sheet)"/>
      <path d="M-113 30 H63 V66 A35 35 0 0 1 28 101 H-113 Z" fill="url(#botRoll)"/>
      <path d="M-113 30 H-50 V101 H-113 Z" fill="url(#botDark)"/>
      <!-- bot roll end: one gentle curl, hollow (generated) -->
      <ellipse cx="-110" cy="66" rx="33.84" ry="36" fill="url(#botWell)"/>
      <ellipse cx="-110" cy="66" rx="28" ry="28" fill="url(#botWellShade)"/>
      <ellipse cx="-110.00" cy="66.00" rx="9.02" ry="9.60" fill="url(#botHole)"/>
      <g mask="url(#botCreaseMask)">
        <path d="M-120.42 54.19 L-119.93 53.71 L-119.42 53.25 L-118.90 52.79 L-118.36 52.36 L-117.82 51.94 L-117.25 51.54 L-116.67 51.15 L-116.08 50.79 L-115.48 50.44 L-114.86 50.10 L-114.22 49.79 L-113.57 49.50 L-112.90 49.23 L-112.23 48.98 L-111.53 48.76 L-110.82 48.56 L-110.10 48.39 L-109.37 48.24 L-108.62 48.12 L-107.87 48.03 L-107.10 47.97 L-106.32 47.94 L-105.53 47.94 L-104.73 47.98 L-103.92 48.05 L-103.11 48.15 L-102.30 48.29 L-101.48 48.47 L-100.65 48.69 L-99.83 48.95 L-99.01 49.25 L-98.19 49.59 L-97.37 49.97 L-96.56 50.39 L-95.76 50.86 L-94.97 51.36 L-94.20 51.91 L-93.43 52.50 L-92.69 53.14 L-91.96 53.82 L-91.25 54.54 L-90.57 55.30 L-89.91 56.10 L-89.28 56.95 L-88.67 57.83 L-88.10 58.75 L-87.57 59.71 L-87.07 60.71 L-86.61 61.74 L-86.19 62.80 L-85.82 63.89 L-85.48 65.02 L-85.20 66.17 L-84.96 67.34 L-84.77 68.54 L-84.64 69.75 L-84.56 70.99 L-84.53 72.24 L-84.56 73.50 L-84.64 74.77 L-84.78 76.04 L-84.98 77.32 L-85.24 78.60 L-85.56 79.87 L-85.94 81.14 L-86.38 82.39 L-86.88 83.64 L-87.44 84.86 L-88.06 86.06 L-88.73 87.24 L-89.47 88.40 L-90.26 89.52 L-91.11 90.61 L-92.01 91.66 L-92.97 92.67 L-93.97 93.63 L-95.03 94.55 L-96.13 95.41 L-97.28 96.23 L-98.47 96.98 L-99.70 97.68 L-100.97 98.32 L-102.27 98.89 L-103.60 99.40 L-104.96 99.84 L-106.35 100.21 L-107.75 100.50 L-109.18 100.73 L-110.62 100.88 L-112.07 100.95 L-113.52 100.95 L-114.98 100.87 L-116.44 100.71 L-117.89 100.48 L-119.33 100.17 L-120.76 99.78 L-122.17 99.31 L-123.56 98.77 L-124.93 98.16 L-126.26 97.47 L-127.57 96.71 L-128.83 95.88 L-130.06 94.99 L-131.24 94.02 L-132.38 93.00 L-133.47 91.93 L-134.52 90.81 L-135.52 89.64 L-136.48 88.42 L-137.38 87.16 L-138.23 85.86 L-139.02 84.52 L-139.76 83.14 L-140.44 81.74 L-141.06 80.30 L-141.62 78.83 L-142.12 77.34 L-142.56 75.83 L-142.93 74.29 L-143.24 72.75 L-143.49 71.18 L-143.67 69.61 L-143.79 68.03 L-143.84 66.45 L-143.82 64.87 L-143.74 63.29 L-143.60 61.71 L-143.39 60.15 L-143.12 58.59 L-142.78 57.05 L-142.38 55.52 L-141.91 54.02 L-141.38 52.54 L-140.80 51.08 L-140.15 49.66 L-139.45 48.26 L-138.69 46.90 L-137.87 45.58 L-137.00 44.29 L-136.07 43.05 L-135.10 41.86 L-134.08 40.70 L-133.01 39.60 L-131.90 38.55 L-130.74 37.55 L-129.55 36.61 L-128.31 35.73 L-127.04 34.90 L-125.74 34.13 L-124.41 33.43 L-123.05 32.78 L-121.66 32.21 L-120.25 31.69 L-118.83 31.25 L-117.38 30.87 L-115.92 30.56 L-114.45 30.31 L-112.97 30.14 L-111.49 30.03 L-110.00 30.00" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round" filter="url(#crease)"/>
      </g>
      <!-- top roll -->
      <path d="M-44 -101 H108 A39 39 0 0 1 108 -23 H-44 Z" fill="url(#topRoll)"/>
      <!-- top roll end: one gentle curl, hollow (generated) -->
      <ellipse cx="-44" cy="-62" rx="33.93" ry="39" fill="url(#topWell)"/>
      <ellipse cx="-44" cy="-62" rx="30" ry="30" fill="url(#topWellShade)"/>
      <ellipse cx="-44.00" cy="-62.00" rx="9.05" ry="10.40" fill="url(#topHole)"/>
      <g mask="url(#topCreaseMask)">
        <path d="M-55.13 -74.01 L-55.58 -73.44 L-56.02 -72.86 L-56.45 -72.26 L-56.86 -71.64 L-57.25 -71.01 L-57.63 -70.36 L-57.99 -69.69 L-58.34 -69.01 L-58.67 -68.31 L-58.98 -67.60 L-59.28 -66.86 L-59.55 -66.11 L-59.80 -65.35 L-60.04 -64.56 L-60.25 -63.77 L-60.44 -62.95 L-60.60 -62.12 L-60.74 -61.27 L-60.85 -60.41 L-60.94 -59.54 L-61.00 -58.65 L-61.02 -57.75 L-61.02 -56.85 L-60.99 -55.93 L-60.92 -55.00 L-60.82 -54.06 L-60.69 -53.12 L-60.52 -52.18 L-60.31 -51.23 L-60.07 -50.28 L-59.79 -49.33 L-59.47 -48.39 L-59.11 -47.45 L-58.71 -46.52 L-58.27 -45.59 L-57.80 -44.68 L-57.28 -43.79 L-56.72 -42.91 L-56.12 -42.04 L-55.48 -41.21 L-54.80 -40.39 L-54.08 -39.60 L-53.33 -38.84 L-52.53 -38.11 L-51.70 -37.42 L-50.83 -36.77 L-49.93 -36.15 L-48.99 -35.57 L-48.02 -35.04 L-47.02 -34.56 L-45.99 -34.13 L-44.93 -33.75 L-43.84 -33.42 L-42.74 -33.14 L-41.61 -32.93 L-40.46 -32.77 L-39.30 -32.68 L-38.12 -32.64 L-36.93 -32.68 L-35.74 -32.77 L-34.54 -32.94 L-33.33 -33.17 L-32.13 -33.47 L-30.93 -33.84 L-29.73 -34.27 L-28.55 -34.78 L-27.38 -35.35 L-26.22 -36.00 L-25.09 -36.71 L-23.98 -37.49 L-22.89 -38.34 L-21.83 -39.25 L-20.81 -40.23 L-19.82 -41.27 L-18.87 -42.37 L-17.96 -43.53 L-17.10 -44.74 L-16.28 -46.02 L-15.51 -47.34 L-14.80 -48.71 L-14.14 -50.13 L-13.54 -51.59 L-13.00 -53.09 L-12.52 -54.63 L-12.11 -56.19 L-11.76 -57.79 L-11.48 -59.41 L-11.27 -61.05 L-11.13 -62.71 L-11.06 -64.38 L-11.06 -66.06 L-11.14 -67.74 L-11.28 -69.42 L-11.50 -71.09 L-11.80 -72.75 L-12.16 -74.40 L-12.60 -76.03 L-13.11 -77.63 L-13.69 -79.20 L-14.34 -80.74 L-15.05 -82.25 L-15.83 -83.71 L-16.68 -85.12 L-17.59 -86.48 L-18.55 -87.79 L-19.56 -89.05 L-20.62 -90.26 L-21.72 -91.42 L-22.87 -92.51 L-24.06 -93.55 L-25.28 -94.53 L-26.55 -95.44 L-27.84 -96.29 L-29.17 -97.08 L-30.52 -97.79 L-31.91 -98.44 L-33.31 -99.01 L-34.74 -99.52 L-36.18 -99.95 L-37.64 -100.31 L-39.11 -100.59 L-40.59 -100.80 L-42.08 -100.94 L-43.57 -101.00 L-45.07 -100.98 L-46.56 -100.89 L-48.04 -100.72 L-49.52 -100.48 L-50.98 -100.16 L-52.44 -99.77 L-53.87 -99.31 L-55.29 -98.78 L-56.69 -98.17 L-58.06 -97.49 L-59.40 -96.75 L-60.72 -95.94 L-62.00 -95.06 L-63.25 -94.12 L-64.46 -93.11 L-65.63 -92.05 L-66.76 -90.93 L-67.84 -89.75 L-68.88 -88.52 L-69.87 -87.24 L-70.81 -85.90 L-71.70 -84.53 L-72.53 -83.10 L-73.31 -81.64 L-74.04 -80.14 L-74.70 -78.61 L-75.31 -77.04 L-75.85 -75.44 L-76.33 -73.82 L-76.76 -72.17 L-77.11 -70.51 L-77.41 -68.83 L-77.64 -67.13 L-77.80 -65.43 L-77.90 -63.71 L-77.93 -62.00" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round" filter="url(#crease)"/>
      </g>
    </g>
  </g>

  <!-- inner edge highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
